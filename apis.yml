name: Zeel
description: 'Zeel is an on-demand wellness marketplace that connects consumers with
  licensed, background-checked massage therapists for in-home, in-hotel, in-office,
  and event chair massage delivered same-day and often within an hour of booking.
  The platform covers a range of modalities including Swedish, deep tissue, sports,
  prenatal, sleep, and couples massage, and offers memberships, gift certificates,
  and a spa-staffing service (Zeel Spa Staffing) that supplies therapists to hotels
  and spas. Zeel operates a consumer-facing web and mobile booking experience across
  dozens of US metros; it does not publish a public developer API, SDKs, or partner
  integration program.'
